<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
    .account { padding: 12px; margin-bottom: 24px; background: #f3f4f6; border-radius: 8px; }
    .product { border: 1px solid #ddd; margin: 10px 0; padding: 10px; border-radius: 8px; }
    .product img { max-width: 200px; }
  </style>
</head>
<body>
  <section class="account" aria-live="polite">
    <strong>Аккаунт:</strong>
    <span id="account-status">Проверяем вход...</span>
  </section>
  <h1>Каталог товаров</h1>
  <div id="product-list">Загрузка...</div>
  <script>
    async function loadAccount() {
      const status = document.getElementById('account-status');
      try {
        const resp = await fetch('/api/shop/session', { credentials: 'include' });
        if (resp.status === 401) {
          status.textContent = 'Вы не вошли. ';
          const loginLink = document.createElement('a');
          loginLink.href = '/oldsite/welcome';
          loginLink.textContent = 'Войти на старом сайте';
          status.appendChild(loginLink);
          return;
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const account = await resp.json();
        const role = account.isAdmin ? 'администратор' : 'пользователь';
        status.textContent = `Вошли: ${account.username} (ID ${account.id}), роль: ${role}`;
      } catch (e) {
        console.error(e);
        status.textContent = 'Не удалось проверить авторизацию';
      }
    }

    async function loadProducts() {
      try {
        const resp = await fetch('/api/shop/products');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const products = await resp.json();
        const list = document.getElementById('product-list');
        list.innerHTML = '';
        products.forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          const title = document.createElement('h3');
          title.textContent = p.title;
          const description = document.createElement('p');
          description.textContent = p.description || '';
          const price = document.createElement('p');
          price.textContent = `Цена: ${p.price}`;
          const category = document.createElement('p');
          category.textContent = `Категория: ${p.category_name || p.category_id}`;
          const images = document.createElement('div');
          div.append(title, description, price, category, images);
          list.appendChild(div);
          if (p.images && p.images.length) {
            p.images.forEach(img => {
              const imgEl = document.createElement('img');
              imgEl.src = '/uploads/' + img.image_path;
              imgEl.alt = p.title;
              images.appendChild(imgEl);
            });
          }
        });
      } catch (e) {
        console.error(e);
        document.getElementById('product-list').innerHTML = 'Ошибка загрузки каталога';
      }
    }
    loadAccount();
    loadProducts();
  </script>
</body>
</html>
